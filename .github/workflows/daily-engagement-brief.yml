name: Daily engagement briefing

on:
  schedule:
    # 06:30 UTC daily = 07:30 Paris CET / 08:30 CEST
    - cron: "30 6 * * *"
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: read
  issues: write   # to create the briefing Issue

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate + post briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        working-directory: scripts/engagement-brief
        run: node run.js

      - name: Post failure Issue if anything broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `❌ Briefing failed — ${today}`,
              body: `Today's briefing didn't generate.\n\n**Run logs:** ${runUrl}\n\nMost likely cause: \`GEMINI_API_KEY\` not set in GitHub Secrets, or a temporary network issue. Check the run logs above. To re-run: Actions tab → Daily engagement briefing → "Run workflow".`,
              labels: ["engagement-brief", "bug"],
            });
