<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hydratation coréenne existing IG</title><style>body{margin:0;min-height:100vh;background:#f6f1ea;color:#332131;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:28px}main{width:min(100%,520px)}header{display:flex;justify-content:space-between;margin-bottom:14px;color:#84675f;font-size:13px;letter-spacing:.04em;text-transform:uppercase}.viewport{width:100%;aspect-ratio:4/5;overflow:hidden;background:white;box-shadow:0 24px 80px rgba(54,33,49,.16)}.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth}.track::-webkit-scrollbar{display:none}.slide{flex:0 0 100%;scroll-snap-align:start;margin:0}img{width:100%;height:100%;object-fit:cover;display:block}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:16px}button{width:44px;height:44px;border:1px solid rgba(132,103,95,.35);background:transparent;color:#332131;border-radius:999px;font-size:24px;cursor:pointer}.dots{display:flex;gap:8px}.dot{width:8px;height:8px;border-radius:999px;background:rgba(132,103,95,.35)}.dot[aria-current=true]{width:22px;background:#ef4889}</style></head><body><main><header><span>Sonagi Beauty</span><span id="count">01 / 07</span></header><section class="viewport"><div class="track" id="track"><figure class="slide"><img src="slides/slide-01.png" alt="Slide 1"></figure><figure class="slide"><img src="slides/slide-02.png" alt="Slide 2"></figure><figure class="slide"><img src="slides/slide-03.png" alt="Slide 3"></figure><figure class="slide"><img src="slides/slide-04.png" alt="Slide 4"></figure><figure class="slide"><img src="slides/slide-05.png" alt="Slide 5"></figure><figure class="slide"><img src="slides/slide-06.png" alt="Slide 6"></figure><figure class="slide"><img src="slides/slide-07.png" alt="Slide 7"></figure></div></section><nav class='controls'><button id='prev'>&#8249;</button><div class='dots' id='dots'></div><button id='next'>&#8250;</button></nav></main><script>const track=document.getElementById('track'),count=document.getElementById('count'),dots=document.getElementById('dots');let current=0,total=7;for(let i=0;i<total;i++){const d=document.createElement('span');d.className='dot';d.setAttribute('aria-current',i===0?'true':'false');dots.appendChild(d)}function update(){current=Math.round(track.scrollLeft/track.clientWidth);count.textContent=String(current+1).padStart(2,'0')+' / 07';[...dots.children].forEach((d,i)=>d.setAttribute('aria-current',i===current?'true':'false'))}function go(delta){let next=Math.max(0,Math.min(total-1,current+delta));track.scrollTo({left:next*track.clientWidth,behavior:'smooth'})}document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);track.addEventListener('scroll',()=>requestAnimationFrame(update));update()</script></body></html>
